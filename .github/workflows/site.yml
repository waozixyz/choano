name: Choano

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choano-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Native, portable and browser game
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ZIRAN_PAR_THREADS: '1'
      MAKEFLAGS: -j1
      OMP_NUM_THREADS: '1'
      EMCC_CORES: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      YUE_DESKTOP_RECOVERY: '0'
    defaults:
      run:
        working-directory: waozixyz/choano
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          path: waozixyz/choano
          persist-credentials: false
      # Same locked compiler setup used by the other Waozi games.
      - uses: ziranlang/ziran/.github/actions/setup@979159a55bcf1f9edb9eb8f26ea10aca421412e2
        with:
          project: waozixyz/choano
          path: ziranlang/ziran
          fetch: true
          packages: >-
            build-essential cmake pkg-config zlib1g-dev libssl-dev libsdl2-dev libcairo2-dev libfreetype-dev libfontconfig-dev libpango1.0-dev libgtk-3-dev libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb xdotool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.6'
          actions-cache-folder: emsdk-cache
      - name: Test replacement assets and native game rules
        run: make test
      - name: Build the independent native and portable editions
        run: make all
      - name: Exercise the native game on a private display
        run: python3 tests/native_test.py
      - name: Build the browser edition with shared Entity Profile
        run: make web
      - name: Exercise browser swimming, Profile and restart
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          node tests/web_test.mjs build/web
      # Keep deployment in the verified workspace, without Actions artifact quota.
      - name: Prepare the Cloudflare Pages project
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site.py prepare
      - name: Publish choano.waozi.xyz
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: waozixyz/choano
          command: pages deploy build/web --project-name=choano --branch=master --commit-hash=${{ github.sha }}
      - name: Connect choano.waozi.xyz
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-site.py connect

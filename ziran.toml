[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "55b0176800d42c829db098a2ef8b0705ea339509"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "8d5d2e752a219674f993473c8410847ba42fad48"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "b95d19334ab4338d3611ec9d44db62b50694e464"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "fc8f3d899dfc3d3e0b535006526485c6d8c8c279"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "fcacb49c1e128e9eb100884e6029b24b4e608d38"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "9ee24b3f70b9c7d776dc391cba15ba97533db227"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "master"

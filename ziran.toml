[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "3f6234e9a181cdad20fac4fad1d1afb1b8ccf054"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "ee9d204548295e6c6900939ba1120efe44659e79"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "ba6a3059f10071e1c521f7fee456f569dec1de98"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "master"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "master"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

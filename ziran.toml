[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "c47f927ca316a0494dff4f2389de3333bc8e08b4"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "ead3eb7aa63535447a1116ecae7bb4d712d72034"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "fec5af055eda9bcc2a2d5a0002a7857bd5cc6a26"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "2d12bfca10e09e83ac540cc5fd85299b8438150a"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "ce85309d693d9cae8a65c3e8750b6cde864c723e"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "62a22c28d1209d8eed2ab5734146faca2ae35b92"

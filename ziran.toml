[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "ee86330414a2febb0135d86506b505af5e6a660b"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "a02feeb703192f1481e72160b1ccff401d17ef9d"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "47ce0302664fe2f87f3cb05407eac7aa09066c96"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "dc47384266d96aaa0f86b8fe104404878179e90b"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "bf3f117da350d0abf8482e4736861274b5f94e2c"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "3063968dc652b2ad96e4dc390728f1239fe25e0b"

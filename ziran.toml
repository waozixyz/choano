[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "0e91eb43bd665f02db86eb9b9cdd875b5436a066"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "b9aed7589e9af2935a9cd9cb260e72944c195762"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "02034376164f09bc342f875f135ef3311781bd3b"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "171b4a0a0fa20ab78726595ee255157065fb6c45"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "0b16a5be141f1fecb9e50492cf0112b2928f5a29"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "6aad71c34fffec40ec903cc8f9d5c95f02572d35"

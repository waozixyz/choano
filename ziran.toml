[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "ee86330414a2febb0135d86506b505af5e6a660b"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "f6299fa1c71a6d9930df7a9a725d1a571adcbc68"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "5d1541025b33a4b19c6ec73bea19dc314e0ef5cb"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "b8f959234e41a597bde5c3d8508e9c3052897349"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "fd4541da5ba2b4da9d0489f20ac463c6e6576253"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "7b125ad80a1398bd122f9c8e2017ebdb66b9e141"

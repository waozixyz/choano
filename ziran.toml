[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "e0367fa9c5731dcf9bb84ed7f3d294570d8c0bda"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "3f72441949d4e16094834fa9220e5d7fa77a0ac0"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "40f598a1719bc99bbef7b61649aa168e923ef1f5"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "3c7df0daa0cfb12fff67dfaac34aac736687a59e"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "59ff268bc8aa86adede06d9af82bad956733a475"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "5120868d2c413bee6a3b8430f9026982545ea452"

[package]
name = "Choano"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "c47f927ca316a0494dff4f2389de3333bc8e08b4"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "298e89940ca436be349dfad41cfb4c9de6b5d054"

[install]
bin = "Choano"

[tool.kryon]
default_profile = "native"
entry = "src/app.zi"

[tool.kryon.profiles.native]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.install]
profile = "native"
name = "Choano"
comment = "Eat or be eaten"
icon = "assets/choano/icon.png"
categories = "Game;"
working_directory = "."

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "6ace294975905400335715e324f919bf05675a21"

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "07227363c9120c77bdb0c020a889a4fc4afa36db"

[dependencies.game2d]
git = "https://github.com/kryonlabs/game2d.git"
ref = "42db0b20e0fd431f254ea8a06e553accda7d2e84"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.kss]
git = "https://github.com/kryonlabs/kss.git"
ref = "1cb9df183089a77c8a16448a556186f30b261a98"

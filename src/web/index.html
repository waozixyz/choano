<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#051120">
<title>Choano — eat or be eaten</title>
<meta name="description" content="Swim through a microscopic world. Eat smaller amoebas, grow, and avoid larger ones. Play Choano free in your browser.">
<link rel="canonical" href="https://choano.waozi.xyz/">
<link rel="icon" href="assets/choano/icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#051120;overflow:hidden}main{position:fixed;inset:0;background:url('assets/choano/title-landscape.png') center/contain no-repeat}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}@media(orientation:portrait){main{background-image:url('assets/choano/title-portrait.png')}}
</style>
<main><canvas id="canvas" tabindex="0" aria-label="Choano"></canvas></main>
<script>
var Module={assetRevision:'__CHOANO_ASSET_REVISION__',buildRevision:'__CHOANO_BUILD_REVISION__',locateFile(path,prefix){return prefix+path+'?v='+Module.buildRevision},canvas:document.getElementById('canvas'),keys:{},sounds:{},muted:false,
 onRuntimeInitialized(){Module.canvas.focus()},
 onAbort(){console.error('Choano could not open.')},
 setMuted(value){this.muted=value;for(const sound of Object.values(this.sounds))sound.muted=value;if(this.loop)this.loop.muted=value},
 music(on){this.musicOn=on;if(!on){if(this.loop){this.loop.pause();this.loop.currentTime=0}return}if(!this.loop){this.loop=new Audio('assets/choano/audio/shark-music.wav?v='+this.assetRevision);this.loop.loop=true;this.loop.volume=.45}this.loop.muted=!!this.muted;this.loop.play().catch(()=>{})},
 playSound(path){if(this.muted)return;for(const playing of Object.values(this.sounds)){playing.pause();playing.currentTime=0}const sound=this.sounds[path]||(this.sounds[path]=new Audio(path+'?v='+this.assetRevision));sound.volume=.6;sound.play().catch(()=>{})},printErr(text){console.error(text)}};
const directions={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{if(Module.profileVisible)return;const key=directions[e.key];if(key){Module.keys[key]=true;e.preventDefault()}});
addEventListener('keyup',e=>{const key=directions[e.key];if(key)Module.keys[key]=false});
addEventListener('blur',()=>Module.keys={});
let started=false;async function start(){if(started)return;started=true;try{
 const manifestResponse=await fetch('assets/manifest.json?v='+Module.assetRevision,{cache:'no-store'});if(!manifestResponse.ok)throw Error('Asset manifest unavailable');const manifest=await manifestResponse.json();
 const paths=Object.keys(manifest.files);const loaded=new Map();let next=0;
 async function worker(){while(next<paths.length){const path=paths[next++];const response=await fetch(path+'?v='+Module.assetRevision);if(!response.ok)throw Error('Asset unavailable');loaded.set(path,new Uint8Array(await response.arrayBuffer()))}}
 await Promise.all(Array.from({length:8},worker));
 Module.preRun=[()=>{for(const [path,bytes] of loaded){Module.FS.mkdirTree('/'+path.slice(0,path.lastIndexOf('/')));Module.FS.writeFile('/'+path,bytes)}loaded.clear()}];
 const game=document.createElement('script');game.src='game.js?v='+Module.buildRevision;game.onerror=Module.onAbort;document.body.appendChild(game)
 }catch(error){console.error(error);Module.onAbort()}}
const shared=document.createElement('script');shared.src='https://account.waozi.xyz/share.js';shared.onload=()=>WaoziAccount.attach(Module,2500).then(start,start);shared.onerror=start;document.head.appendChild(shared);setTimeout(start,4000);
</script>
</html>
